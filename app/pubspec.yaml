name: stepcue
description: "Freezing-of-gait detection, rhythm cueing and walking insights for people with Parkinson's."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  sensors_plus: 7.1.0
  vibration: ^3.2.1
  wakelock_plus: 1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fog_detector.json
    - assets/gait_profile_kmeans.json
    - assets/demo/
